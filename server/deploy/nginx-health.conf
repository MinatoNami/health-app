# Health Exporter ingest endpoint.
#
# This coexists with whatever else nginx already serves on 443: it matches by
# SNI on the tailnet name only, and deliberately declares no default_server so
# it cannot capture traffic meant for another site.
#
# Over the tailnet, though, the 443 listener below never runs. Tailscale Serve
# intercepts traffic addressed to the node's Tailscale IP before it reaches a
# normal socket, and it already publishes `/` on this hostname for another app.
# So the tailnet route in is the loopback listener: Tailscale Serve terminates
# TLS with the tailnet certificate and forwards /health-app here.
#
# Going through nginx rather than straight to gunicorn is deliberate. This block
# is where the 64 MB body limit, the 900-second timeouts and the dashboard live,
# and a first sync needs all three.

server {
    # No http2: the `http2 on` directive needs nginx >= 1.25.1 (this host runs
    # 1.24), and enabling it on the listen socket would change it for the other
    # site sharing port 443. HTTP/1.1 costs nothing here — the workload is one
    # large POST at a time, not many small parallel requests.
    listen 443 ssl;
    listen [::]:443 ssl;

    # Plaintext, loopback only — never exposed. TLS for this path is terminated
    # by Tailscale Serve one hop earlier; see the note at the top of the file.
    listen 127.0.0.1:8082;

    server_name __SERVER_NAME__;

    ssl_certificate     /etc/nginx/certs/health-exporter.crt;
    ssl_certificate_key /etc/nginx/certs/health-exporter.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:health_tls:10m;
    ssl_session_timeout 1d;

    # A first sync can ship 5,000 records in one batch.
    client_max_body_size 64m;
    # Buffer the request to disk if needed rather than streaming a slow phone
    # upload straight into a gunicorn worker and holding it hostage.
    client_body_buffer_size 1m;
    client_body_timeout 120s;

    access_log /var/log/nginx/health-exporter.access.log;
    error_log  /var/log/nginx/health-exporter.error.log;

    # The same server, reachable a second way: everything under /health-app/ is
    # stripped of that prefix and matched again from the top.
    #
    # `last` and not `break` — it restarts location selection with the rewritten
    # URI, so /health-app/v1/health/ping lands in `location /` and reaches
    # gunicorn as /v1/health/ping. Django's URLconf does not know the mount
    # exists and does not need to. One consequence worth knowing: the prefix is
    # gone by the time a location is chosen, so nothing downstream can
    # reconstruct it — fine here, because the API returns JSON and the client
    # builds every URL it calls (`SinkConfiguration.apiEndpoint`).
    #
    # Declared before the locations only for readability; server-level rewrites
    # run in their own phase, ahead of all location matching, whatever the order.
    #
    # The root is deliberately left working. Existing installs are pointed at it,
    # and this is meant to add a way in, not close one.
    rewrite ^/health-app/(.*)$ /$1 last;
    rewrite ^/health-app$      /  last;

    # The dashboard is a static SPA. Served directly by nginx rather than
    # proxied through gunicorn — no reason to spend a Python worker on a file
    # that never changes between deploys.
    # Note: reached as /health-app/dashboard this redirects to /dashboard/,
    # dropping the mount. The dashboard is not what the prefix is for; link
    # to /health-app/dashboard/ with the slash and it stays put.
    location = /dashboard { return 301 /dashboard/; }

    # Vite fingerprints these filenames, so they can be cached hard. Declared
    # before the shell location and with ^~ so it wins the prefix match.
    location ^~ /dashboard/assets/ {
        alias /var/www/health-dashboard/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /dashboard/ {
        alias /var/www/health-dashboard/;
        # Client-side routing: unknown paths fall back to the app shell rather
        # than 404ing.
        try_files $uri $uri/ /dashboard/index.html;
        # The shell must never be cached, or a deploy serves new fingerprinted
        # assets from an index that still references the old ones.
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite, not $proxy_add_x_forwarded_for (which appends). Appending
        # keeps whatever the caller sent as the first entry, and anything
        # downstream that reads the first entry is then trusting the client:
        # that made the login throttle bypassable with one spoofed header.
        # There is exactly one proxy here, so the real peer is the only useful
        # value and the chain is worth nothing.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # Matches gunicorn's timeout so nginx doesn't hang up on a large batch
        # the worker is still committing, or on a long CSV export mid-stream.
        proxy_read_timeout    900s;
        proxy_send_timeout    900s;
        proxy_connect_timeout 10s;

        # Exports are streamed deliberately; buffering them here would defeat
        # that and hold hundreds of megabytes in nginx before the client sees
        # a byte. (The view also sends X-Accel-Buffering: no.)
        proxy_buffering on;
        proxy_max_temp_file_size 0;
    }
}
