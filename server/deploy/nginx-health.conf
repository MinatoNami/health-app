# Health Exporter ingest endpoint.
#
# This coexists with whatever else nginx already serves on 443: it matches by
# SNI on the tailnet name only, and deliberately declares no default_server so
# it cannot capture traffic meant for another site.

server {
    # No http2: the `http2 on` directive needs nginx >= 1.25.1 (this host runs
    # 1.24), and enabling it on the listen socket would change it for the other
    # site sharing port 443. HTTP/1.1 costs nothing here — the workload is one
    # large POST at a time, not many small parallel requests.
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name __SERVER_NAME__;

    ssl_certificate     /etc/nginx/certs/health-exporter.crt;
    ssl_certificate_key /etc/nginx/certs/health-exporter.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:health_tls:10m;
    ssl_session_timeout 1d;

    # A first sync can ship 5,000 records in one batch.
    client_max_body_size 64m;
    # Buffer the request to disk if needed rather than streaming a slow phone
    # upload straight into a gunicorn worker and holding it hostage.
    client_body_buffer_size 1m;
    client_body_timeout 120s;

    access_log /var/log/nginx/health-exporter.access.log;
    error_log  /var/log/nginx/health-exporter.error.log;

    # The dashboard is a static SPA. Served directly by nginx rather than
    # proxied through gunicorn — no reason to spend a Python worker on a file
    # that never changes between deploys.
    location = /dashboard { return 301 /dashboard/; }

    # Vite fingerprints these filenames, so they can be cached hard. Declared
    # before the shell location and with ^~ so it wins the prefix match.
    location ^~ /dashboard/assets/ {
        alias /var/www/health-dashboard/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /dashboard/ {
        alias /var/www/health-dashboard/;
        # Client-side routing: unknown paths fall back to the app shell rather
        # than 404ing.
        try_files $uri $uri/ /dashboard/index.html;
        # The shell must never be cached, or a deploy serves new fingerprinted
        # assets from an index that still references the old ones.
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite, not $proxy_add_x_forwarded_for (which appends). Appending
        # keeps whatever the caller sent as the first entry, and anything
        # downstream that reads the first entry is then trusting the client:
        # that made the login throttle bypassable with one spoofed header.
        # There is exactly one proxy here, so the real peer is the only useful
        # value and the chain is worth nothing.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # Matches gunicorn's 180s timeout so nginx doesn't hang up on a large
        # batch that the worker is still committing.
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
        proxy_connect_timeout 10s;
    }
}
