<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #121113; }
    a { color: #E64F5A; text-decoration: none; }
    a:hover { color: #F2727B; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #121113; font-family: 'IBM Plex Sans', 'Helvetica Neue', system-ui, sans-serif; color: #F4F1EC; overflow: hidden; display: flex; flex-direction: column;">

  <!-- Top inset. Deliberately empty: the real status bar draws here. -->
  <div style="height: 54px; flex-shrink: 0;"></div>

  <div style="flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px 14px;">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9A939B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"></rect><path d="M9 4v16"></path></svg>
    <div style="font-size: 14px; font-weight: 600; color: #9A939B;">New question</div>
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9A939B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="12" cy="19" r="1.4"></circle></svg>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 0 20px; display: flex; flex-direction: column; gap: 16px;">
    <div style="border: 1px solid #2E2A30; border-radius: 14px; background: #171518; overflow: hidden;">
      <div style="padding: 12px 15px; border-bottom: 1px solid #262229; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #665F68; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;">Your measured week</div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 15px; border-top: 1px solid #201D22;">
        <div style="flex-grow: 1; font-size: 13px; color: #C9C2C8;">Steps</div>
        <div style="font-size: 13px; font-weight: 600; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;">12.3k</div>
        <div style="width: 46px; text-align: right; font-size: 12px; font-weight: 600; color: #6FBFA8;">+32%</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 15px; border-top: 1px solid #201D22;">
        <div style="flex-grow: 1; font-size: 13px; color: #C9C2C8;">Sleep</div>
        <div style="font-size: 13px; font-weight: 600; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;">7.0 hr</div>
        <div style="width: 46px; text-align: right; font-size: 12px; font-weight: 600; color: #6FBFA8;">+10%</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 15px; border-top: 1px solid #201D22;">
        <div style="flex-grow: 1; font-size: 13px; color: #C9C2C8;">Resting HR</div>
        <div style="font-size: 13px; font-weight: 600; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;">58 bpm</div>
        <div style="width: 46px; text-align: right; font-size: 12px; font-weight: 600; color: #6FBFA8;">−5%</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 15px; border-top: 1px solid #201D22;">
        <div style="flex-grow: 1; font-size: 13px; color: #C9C2C8;">Weight</div>
        <div style="font-size: 13px; font-weight: 600; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;">76.0 kg</div>
        <div style="width: 46px; text-align: right; font-size: 12px; font-weight: 600; color: #9A939B;">−2%</div>
      </div>
    </div>
    <div style="font-size: 13px; color: #665F68; line-height: 1.5;">Ask anything about these figures. Answers cite the days they were measured from.</div>
  </div>

  <div style="flex-shrink: 0; padding: 12px 20px 0; display: flex; gap: 8px; overflow: hidden;">
    <div style="flex-shrink: 0; display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2E2A30; background: #1A181B; font-size: 12.5px; color: #C9C2C8; white-space: nowrap;">Why did sleep improve?</div>
    <div style="flex-shrink: 0; display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #2E2A30; background: #1A181B; font-size: 12.5px; color: #C9C2C8; white-space: nowrap;">Am I overtraining?</div>
  </div>

  <div style="flex-shrink: 0; padding: 12px 20px 8px;">
    <div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 11px 12px 11px 15px; border-radius: 24px; background: #1E1B20; border: 1px solid #2E2A30;">
      <div style="flex-grow: 1; font-size: 14px; color: #665F68;">Ask about your health data</div>
      <div style="width: 32px; height: 32px; border-radius: 16px; background: #2E2A30; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#665F68" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
      </div>
    </div>
  </div>
  <div style="flex-shrink: 0; display: flex; padding: 4px 12px 24px; border-top: 1px solid #201D22; background: #131114;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#665F68" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h4l2.5-7 4 14L16 13h5"></path></svg>
      <div style="font-size: 10px; font-weight: 600; color: #665F68;">Today</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#E64F5A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.8 4.9L18.6 11l-4.8 2.1L12 18l-1.8-4.9L5.4 11l4.8-2.1z"></path></svg>
      <div style="font-size: 10px; font-weight: 600; color: #E64F5A;">Insights</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#665F68" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9"></path><path d="M10 19V5"></path><path d="M16 19v-7"></path><path d="M22 19H2"></path></svg>
      <div style="font-size: 10px; font-weight: 600; color: #665F68;">Trends</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#665F68" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"></path></svg>
      <div style="font-size: 10px; font-weight: 600; color: #665F68;">Data</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
