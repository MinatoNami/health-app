<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #121113; }
    a { color: #E64F5A; text-decoration: none; }
    a:hover { color: #F2727B; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 1320px; height: 660px; background: #121113; font-family: 'IBM Plex Sans', 'Helvetica Neue', system-ui, sans-serif; color: #F4F1EC; padding: 40px 44px; display: flex; flex-direction: column; gap: 22px;">

  <div style="display: flex; flex-direction: column; gap: 7px;">
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #E64F5A; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace;">Navigation</div>
    <div style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em;">Six screens, four tabs, one way in and one way back</div>
  </div>

  <svg width="100%" viewBox="0 0 1230 430" style="display: block; flex-grow: 1;">
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#5E5762"></path>
      </marker>
      <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#E64F5A"></path>
      </marker>
    </defs>

    <!-- tab-bar rail -->
    <rect x="20" y="376" width="1190" height="42" rx="10" fill="#17151A" stroke="#2A262E" stroke-width="1"></rect>
    <text x="42" y="402" fill="#665F68" font-size="12" font-family="'IBM Plex Mono', monospace">TAB BAR &mdash; reachable from anywhere</text>
    <text x="470" y="402" fill="#9A939B" font-size="13" font-weight="600">Today</text>
    <text x="560" y="402" fill="#9A939B" font-size="13" font-weight="600">Insights</text>
    <text x="665" y="402" fill="#9A939B" font-size="13" font-weight="600">Trends</text>
    <text x="758" y="402" fill="#9A939B" font-size="13" font-weight="600">Data</text>

    <!-- TODAY -->
    <rect x="20" y="120" width="200" height="112" rx="12" fill="#1C1920" stroke="#E64F5A" stroke-width="1.5"></rect>
    <text x="40" y="152" fill="#F4F1EC" font-size="16" font-weight="600">Today</text>
    <text x="40" y="176" fill="#9A939B" font-size="12">One sentence, what moved,</text>
    <text x="40" y="194" fill="#9A939B" font-size="12">what is steady, what stopped</text>
    <text x="40" y="218" fill="#E64F5A" font-size="10.5" font-family="'IBM Plex Mono', monospace">LAUNCH SCREEN</text>

    <!-- METRIC DETAIL -->
    <rect x="330" y="20" width="200" height="104" rx="12" fill="#17151A" stroke="#2E2A30" stroke-width="1"></rect>
    <text x="350" y="50" fill="#F4F1EC" font-size="15" font-weight="600">Metric detail</text>
    <text x="350" y="72" fill="#9A939B" font-size="12">Figure, coverage,</text>
    <text x="350" y="90" fill="#9A939B" font-size="12">what it cannot tell you</text>
    <text x="350" y="112" fill="#665F68" font-size="10.5" font-family="'IBM Plex Mono', monospace">back returns to Today</text>

    <!-- INSIGHTS EMPTY -->
    <rect x="330" y="168" width="200" height="104" rx="12" fill="#17151A" stroke="#2E2A30" stroke-width="1"></rect>
    <text x="350" y="198" fill="#F4F1EC" font-size="15" font-weight="600">Insights &mdash; new</text>
    <text x="350" y="220" fill="#9A939B" font-size="12">Opens on the measured</text>
    <text x="350" y="238" fill="#9A939B" font-size="12">week, not empty space</text>

    <!-- INSIGHTS ANSWER -->
    <rect x="640" y="168" width="210" height="104" rx="12" fill="#17151A" stroke="#2E2A30" stroke-width="1"></rect>
    <text x="660" y="198" fill="#F4F1EC" font-size="15" font-weight="600">Insights &mdash; answer</text>
    <text x="660" y="220" fill="#9A939B" font-size="12">Prose, then the figures</text>
    <text x="660" y="238" fill="#9A939B" font-size="12">it rests on, with coverage</text>

    <!-- DATA -->
    <rect x="330" y="290" width="200" height="70" rx="12" fill="#17151A" stroke="#2E2A30" stroke-width="1"></rect>
    <text x="350" y="320" fill="#F4F1EC" font-size="15" font-weight="600">Data</text>
    <text x="350" y="342" fill="#9A939B" font-size="12">Sources, server, staleness</text>

    <!-- TRENDS -->
    <rect x="960" y="20" width="200" height="104" rx="12" fill="#17151A" stroke="#2E2A30" stroke-width="1"></rect>
    <text x="980" y="50" fill="#F4F1EC" font-size="15" font-weight="600">Trends</text>
    <text x="980" y="72" fill="#9A939B" font-size="12">One metric over time,</text>
    <text x="980" y="90" fill="#9A939B" font-size="12">gaps drawn as gaps</text>

    <!-- Today -> Metric detail -->
    <path d="M 220 152 C 270 152, 280 72, 330 72" stroke="#E64F5A" stroke-width="1.6" fill="none" marker-end="url(#arA)"></path>
    <text x="236" y="104" fill="#E8949B" font-size="11">tap a row in</text>
    <text x="236" y="119" fill="#E8949B" font-size="11">&ldquo;What moved&rdquo;</text>

    <!-- Today -> Insights new -->
    <path d="M 220 190 L 330 205" stroke="#E64F5A" stroke-width="1.6" fill="none" marker-end="url(#arA)"></path>
    <text x="232" y="184" fill="#E8949B" font-size="11">tap the ask bar</text>

    <!-- Today -> Data -->
    <path d="M 220 220 C 270 240, 280 320, 330 320" stroke="#5E5762" stroke-width="1.4" fill="none" marker-end="url(#ar)"></path>
    <text x="228" y="300" fill="#7D7480" font-size="11">tap the amber</text>
    <text x="228" y="315" fill="#7D7480" font-size="11">&ldquo;stopped&rdquo; callout</text>

    <!-- Detail -> Insights answer -->
    <path d="M 530 96 C 600 96, 600 190, 640 200" stroke="#5E5762" stroke-width="1.4" fill="none" marker-end="url(#ar)"></path>
    <text x="546" y="132" fill="#7D7480" font-size="11">&ldquo;Ask about this&rdquo;</text>

    <!-- Insights new -> answer -->
    <path d="M 530 220 L 640 220" stroke="#E64F5A" stroke-width="1.6" fill="none" marker-end="url(#arA)"></path>
    <text x="548" y="212" fill="#E8949B" font-size="11">send a question</text>
    <text x="548" y="243" fill="#7D7480" font-size="10.5" font-family="'IBM Plex Mono', monospace">~20&ndash;60s</text>

    <!-- Detail back to Today -->
    <path d="M 330 44 C 250 44, 240 120, 226 132" stroke="#3E3944" stroke-width="1.3" fill="none" stroke-dasharray="4 4" marker-end="url(#ar)"></path>

    <!-- tab rail connectors -->
    <path d="M 120 232 L 120 376" stroke="#3E3944" stroke-width="1.2" stroke-dasharray="3 4" fill="none"></path>
    <path d="M 430 272 L 430 376" stroke="#3E3944" stroke-width="1.2" stroke-dasharray="3 4" fill="none"></path>
    <path d="M 745 272 L 745 376" stroke="#3E3944" stroke-width="1.2" stroke-dasharray="3 4" fill="none"></path>
    <path d="M 1060 124 L 1060 376" stroke="#3E3944" stroke-width="1.2" stroke-dasharray="3 4" fill="none"></path>
    <path d="M 430 360 L 430 376" stroke="#3E3944" stroke-width="1.2" stroke-dasharray="3 4" fill="none"></path>
  </svg>

  <div style="display: flex; gap: 28px; align-items: center; padding-top: 4px; border-top: 1px solid #262229;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 20px; height: 2px; background: #E64F5A; border-radius: 1px;"></div>
      <div style="font-size: 12px; color: #9A939B;">The main path</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 20px; height: 2px; background: #5E5762; border-radius: 1px;"></div>
      <div style="font-size: 12px; color: #9A939B;">Secondary</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 20px; height: 0; border-top: 1.5px dashed #3E3944;"></div>
      <div style="font-size: 12px; color: #9A939B;">Back, or a tab</div>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="font-size: 12px; color: #665F68; line-height: 1.5; max-width: 470px; text-align: right;">
      Nothing here is more than two taps from Today, and every screen with a figure on it has a route into asking about that figure.
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
